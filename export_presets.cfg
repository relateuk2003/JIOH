; JIOH-60: named as in OTIF so the shared scripts need no translation table.
; Every preset excludes tools/, build/, tests/ and the debug scenes, and
; carries .ogv footage as-is (the pack is not compressed). Run them through
; build/build.sh, never by hand.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.ogv, resources/fonts/*.txt"
exclude_filter="tools/*, build/*, tests/*, scenes/debug/*, scripts/debug/*, addons/*"
export_path="build/out/windows/janice.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="Janice Is On Holiday"
application/company_name="Relate Games"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.ogv, resources/fonts/*.txt"
exclude_filter="tools/*, build/*, tests/*, scenes/debug/*, scripts/debug/*, addons/*"
export_path="build/out/linux/janice.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.2]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.ogv, resources/fonts/*.txt"
exclude_filter="tools/*, build/*, tests/*, scenes/debug/*, scripts/debug/*, addons/*"
export_path="build/out/macos/janice.zip"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
